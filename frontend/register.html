<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | SmartCare</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="page-register">
    <header>
        <div class="container navbar">
            <a class="brand" href="index.html">
                <span class="brand-mark">SC</span>
                <span>SmartCare</span>
            </a>
            <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a class="active" href="register.html">Register</a>
            </nav>
        </div>
    </header>

    <main class="page-shell container">
        <div class="auth-card">
    <h1>Create your account</h1>
    <p class="inline-note">Join SmartCare as a patient or clinic.</p>
    
    <!-- Register Type Switch -->
    <div class="register-type-switch">
        <button type="button" class="type-btn active" data-type="patient">
            Patient
        </button>
        <button type="button" class="type-btn" data-type="clinic">
            Clinic
        </button>
    </div>

    <!-- PATIENT FORM (Visible by default) -->
    <form id="patient-form">
        <div class="form-row">
            <div>
                <label for="patient-first-name">Full name</label>
                <input id="patient-full-name" type="text" placeholder="Ada" required />
            </div>
            <div>
                <label for="gender">Gender</label>
                <select id="gender" name="gender" >
                  <option value="" disabled selected>-- Select gender --</option>
                  <option value="male">Male</option>
                  <option value="Female">Female</option>
                  <option value="other">other</option>
                </select>
            </div>
            <div>
                <label for="patient-dob">DateOfBirth</label>
                <input id="patient-dob" type="date" placeholder="00-00-0000" required />
            </div>
            <div>
                <label for="patient-nid">NID</label>
                <input id="patient-nid" type="number" placeholder="123456" required />
            </div>
            <div>
                <label for="patient-emergency-phone">Emergency Contact Phone</label>
                <input id="patient-emergency-phone" type="number" placeholder="980000000" required />
            </div>
            <div>
                <label for="patient-emergency-name">Emergency Contact name</label>
                <input id="patient-emergency-name" type="text" placeholder="Lovelace" required />
            </div>
            <div>
                <label for="patient-emergency-relationship">Emergency Contact RelationShip</label>
                <input id="patient-emergency-relationship" type="text" placeholder="Lovelace" required />
            </div>
        </div>

        <label for="patient-email">Email</label>
        <input id="patient-email" type="email" placeholder="name@example.com" required />

        <label for="patient-password">Password</label>
        <input id="patient-password" type="password" placeholder="Create a password" required />

        <button class="btn btn-primary" type="submit">Register as Patient</button>
    </form>

    <!-- CLINIC FORM (Hidden by default) -->
    <form id="clinic-form" hidden>
        <div class="form-row">
            <div>
                <label for="clinic-name">Clinic Name</label>
                <input id="clinic-name" type="text" placeholder="City Health Clinic" required />
            </div>
            <div>
                <label for="clinic-slug-name">Clinic-Slug Name</label>
                <input id="clinic-slug-name" type="text" placeholder="City Health Clinic" required />
            </div>
            <div>
                <label for="clinic-phone">Phone Number</label>
                <input id="clinic-phone" type="tel" placeholder="+1 234 567 890" required />
            </div>
            <div>
                <label for="clinic-addresh">Clinic Address</label>
                <input id="clinic-addresh" type="text" placeholder="City Health Clinic" required />
            </div>
            <div>
                <label for="clinic-city">Clinic city</label>
                <input id="clinic-city" type="text" placeholder="City Health Clinic" required />
            </div>
            <div>
                <label for="clinic-name">Clinic State</label>
                <select id="state" name="state">
                    <option value="" disabled selected>-- Select a Province --</option>
                    <option value="koshi">Koshi Provision</option>
                    <option value="madhesh">Madhesh Provision</option>
                    <option value="Bagmati">Bagmati Provision</option>
                    <option value="Gandaki">Gandaki Provision</option>
                    <option value="lumbini">Lumbini Provision</option>
                    <option value="karnali">Karnali Provision</option>
                    <option value="sudurpashchim">Sudurpashchim Provision</option>
                </select>
            </div>
        </div>

        <label for="clinic-email">Clinic Email</label>
        <input id="clinic-email" type="email" placeholder="contact@clinic.com" required />

        <label for="clinic-password">Password</label>
        <input id="clinic-password" type="password" placeholder="Create a password" required />

        <button class="btn btn-primary" type="submit">Register Clinic</button>
    </form>

    <p class="inline-note" style="margin-top: 1.5rem;">Already have an account? <a href="login.html">Sign in</a>.</p>
</div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© <span data-year></span> SmartCare. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/register.js"></script>
    <script src="assets/js/common.js"></script>
</body>

</html>
