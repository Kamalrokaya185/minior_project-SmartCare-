<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Appointments | SmartCare</title>
    <link rel="stylesheet" href="../../assets/css/panel.css">
    <!-- <link rel="stylesheet" href="../../assets/css/clinic/doctor.css"> -->
    <link rel="stylesheet" href="../../assets/css/patient/myappointment.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <button class="toggle-btn" id="toggle-btn" onclick="toggleSidebar()">☰</button>
    <div id="topbar"></div>

    <main class="main-content" id="main-content">
        <div class="page-heading-row">
            <div>
                <h1>My Appointments</h1>
                <p>Your upcoming visit and appointment history.</p>
            </div>
            <a href="booking.html" class="btn btn-primary">Find Clinic</a>
        </div>

        <!-- Upcoming Appointment -->
        <section class="card" id="upcomingSection">
            <h2>Upcoming Appointment</h2>
            <div id="upcomingCard">
                <p style="color:#94a3b8;">Loading...</p>
            </div>
        </section>

        <!-- History -->
        <section class="card table-card">
            <div class="table-header">
                <h2>Appointment History</h2>
            </div>
            <div class="table-wrapper-approve">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Doctor</th>
                            <th>Clinic</th>
                            <th>Status</th>
                            <th>Payment</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="7" style="text-align:center;color:#94a3b8;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Details / Cancel Modal -->
    <div id="detailModal" class="modal hidden" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" type="button" aria-label="Close">×</button>
            <h3>Appointment Details</h3>
            <div id="modalBody"></div>
            <div class="form-actions">
                <button class="btn btn-danger hidden" id="cancelAppointmentBtn" type="button">Cancel Appointment</button>
            </div>
        </div>
    </div>

    <script src="../../assets/js/components/patient.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/patient/my-appointments.js"></script>
</body>
</html>
