<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Appointments | SmartCare</title>
    <link rel="stylesheet" href="../../assets/css/panel.css">
    <link rel="stylesheet" href="../../assets/css/clinic/appointment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        .status-pill.pending {
    background: #fef3c7;
    color: #92400e;
}
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <button class="toggle-btn" id="toggle-btn" onclick="toggleSidebar()">☰</button>
    <div id="topbar"></div>

    <main class="main-content" id="main-content">
        <div class="page-heading-row">
            <div>
                <h1>Appointments</h1>
                <p>View and filter appointments by date.</p>
            </div>
        </div>

        <section class="card table-card">
            <div class="table-header">
                <h2 id="listTitle">Today's Appointments</h2>
                <div class="table-header-actions">
                    <input type="date" id="dateFilter" />
                    <button class="btn btn-primary" id="todayBtn" type="button">Today</button>
                </div>
            </div>
            <div class="table-wrapper-approve">
                <table>
                    <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Specialization</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Payment</th>
                            <th>Fee</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsBody">
                        <tr><td colspan="7" style="text-align:center;color:#94a3b8;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../../assets/js/components/clinic.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/clinic/appointments.js"></script>
</body>
</html>
