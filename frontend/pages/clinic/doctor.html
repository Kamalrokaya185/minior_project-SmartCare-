<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clinic Management | SmartCare</title>
    <link rel="stylesheet" href="../../assets/css/panel.css">
    <link rel="stylesheet" href="../../assets/css/clinic/doctor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity=""
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>
     <button class="toggle-btn" id="toggle-btn" onclick="toggleSidebar()">☰</button>
    <div id="topbar"></div>
<main class="main-content" id="main-content">
        <div>
            <h1>Doctor Management</h1>
            <p>Track doctor records in one place.</p>
        </div>

        <section class="card table-card">
            <div class="table-header">
                <h2>Doctor Schedule Overview</h2>
                <div class="table-header-actions">
                    <span class="table-summary">records available</span>
                    <button class="btn btn-primary" id="addDoctorBtn" type="button">Add Doctor</button>
                </div>
            </div>
            <div class="active-department-section">
                <div class="table-wrapper-approve">
                    <table id="tableOfdepartment">
                        <theader id="departmentName">departmentName</theader>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Address</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="departmentBody">
                            <tr>
                                <td colspan="5" style="text-align: center; color: #94a3b8;">Loading data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    <div id="detailModal" class="modal hidden" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" type="button" aria-label="Close">×</button>
            <h3>Doctor Details</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="addModal" class="modal hidden" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" type="button" aria-label="Close">×</button>
            <h3 id="formTitle">Add Doctor</h3>
            <form id="addForm" class="doctor-form">
                <label>
                    Doctor Name
                    <input id="fullName" type="text" required />
                </label>
                <label>
                    Doctor Specialization
                    <input id="specialization" type="text" required />
                </label>
                <label>
                    Department
                    <input id="department" type="text" required />
                </label>
                <label>
                    Medical License Number
                    <input id="licenseNumber" type="text" required />
                </label>
                <label>
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" >
                      <option value="" disabled selected>-- Select gender --</option>
                      <option value="male">Male</option>
                      <option value="Female">Female</option>
                      <option value="other">other</option>
                    </select>
                </label>
                <div class="form-actions">
                    <button class="btn btn-add" type="button" data-close="add">Cancel</button>
                    <button class="btn btn-primary" type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>

</main>
    <script src="../../assets/js/components/clinic.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/clinic/doctor.js"></script>
</body>
</html>
