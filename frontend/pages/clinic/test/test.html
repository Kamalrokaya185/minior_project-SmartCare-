  <div><h3>Doctorschedule</h3></div>
                    <label>
                        dayOfWeek
                        <select id="dayOfWeek" name="dayOfWeek">
                            <option value="" disabled selected>-- Select Days --</option>
                            <option value="7">Sunday</option>
                            <option value="1">Monday</option>
                            <option value="2">Thuesday</option>
                            <option value="3">Wenesday</option>
                            <option value="4">Thusday</option>
                            <option value="5">Friday</option>
                            <option value="6">Sutarday</option>
                            <option value="">Other</option>
                        </select>
                    </label>
                    <label>
                        SpecificDate PerMonth
                        <input id="specificDate" type="date" ></input>
                    </label>
                    <label>
                        IsRepeated Date
                        <select name="isRecurring" id="isRecurring">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </label>
                    <label>
                        Starting Time
                        <input id="startTime" type="time" required></input>
                    </label>
                    <label>
                        Ending Time
                        <input id="endTime" type="time" required></input>
                    </label>
                    <label>
                        Duration Time(munites) perAppointment
                        <input id="slotDurationMinutes" type="number" required></input>
                    </label>
                    <label>
                        Effective From
                        <input id="effectiveFrom" type="date" required></input>
                    </label>
                    <label>
                        Effective To
                        <input id="effectiveTo" type="date" required></input>
                    </label>
