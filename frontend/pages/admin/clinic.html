<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clinic Management | SmartCare</title>
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <link rel="stylesheet" href="../../assets/css/panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity=""
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* ==========================================================================
   Main Content Layout
   ========================================================================== */
.main-content {
    padding: 2rem;
    background-color: #f8fafc;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #1e293b;
    box-sizing: border-box;
}

/* Page Title */
.main-content h1 {
    font-size: 1.75rem;
    font-weight: 700;
    text-transform: capitalize;
    color: #0f172a;
    margin-bottom: 2rem;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 0.75rem;
}

/* ==========================================================================
   Clinic Sections & Summary Cards
   ========================================================================== */
.approved-clinic-section,
.pending-clinic-section,
.suspend-clinic-section {
    background: #ffffff;
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2.5rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid #e2e8f0;
}

/* Summary Stats Header */
.approved-clinic-section > div:first-child,
.pending-clinic-section > div:first-child,
.suspend-clinic-section > div:first-child {
    display: inline-block;
    background: #f1f5f9;
    padding: 1rem 1.5rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    min-width: 180px;
}

.approved-clinic-section > div:first-child h2,
.pending-clinic-section > div:first-child h2,
.suspend-clinic-section > div:first-child h2 {
    font-size: 1.5rem;
    color: #0f172a;
    margin: 0;
    font-weight: 700;
}

.approved-clinic-section > div:first-child h5,
.pending-clinic-section > div:first-child h5,
.suspend-clinic-section > div:first-child h5 {
    font-size: 0.85rem;
    color: #64748b;
    margin: 0.25rem 0 0 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Accent lines to differentiate sections easily */
.approved-clinic-section { border-left: 5px solid #10b981; }
.pending-clinic-section { border-left: 5px solid #f59e0b; }
.suspend-clinic-section { border-left: 5px solid #bc1111; }

/* ==========================================================================
   Table Styling
   ========================================================================== */
.table-wrapper-approve,
.table-wrapper-pending,
.table-wrapper-suspend {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 0.95rem;
}

table th {
    background-color: #f8fafc;
    color: #475569;
    font-weight: 600;
    padding: 1rem;
    border-bottom: 2px solid #e2e8f0;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
}

table td {
    padding: 1rem;
    border-bottom: 1px solid #e2e8f0;
    color: #334155;
    vertical-align: middle;
}

table tbody tr:last-child td {
    border-bottom: none;
}

table tbody tr:hover {
    background-color: #f1f5f9;
    transition: background-color 0.2s ease;
}

/* ==========================================================================
   Status Badges (For your table rows)
   ========================================================================== */
/* Generic styling if you insert plain text or spans into your dynamic rows */
.status-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: capitalize;
}

.status-approved {
    background-color: #d1fae5;
    color: #065f46;
}

.status-pending {
    background-color: #fef3c7;
    color: #92400e;
}

.status-suspend{
    background-color:#fef3c7;
    color:#bc1111
}

    </style>
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>
     <button class="toggle-btn" id="toggle-btn" onclick="toggleSidebar()">☰</button>
    <div id="topbar"></div>
<main class="main-content" id="main-content">

    <h1>admin page clinic</h1>
    <div class="approved-clinic-section">
        <div>
            <h5>Approved Clinic</h5>
        </div>
        <div class="table-wrapper-approve">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="approveClinicTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #94a3b8;">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="pending-clinic-section">
        <div>
            <h5>Pending Clinic</h5>
        </div>
        <div class="table-wrapper-pending">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pendingClinicTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #94a3b8;">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="suspend-clinic-section">
        <div>
            <h5>Suspend Clinic</h5>
        </div>
        <div class="table-wrapper-suspend">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="suspendClinicTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #94a3b8;">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    

</main> 

    <script src="../../assets/js/components/admin.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/admin/clinic.js"></script>
</body>
</html>
